services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: password
    volumes:
      - 'postgres:/var/lib/postgresql/data'
    ports:
      - "5432:5432"
  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    volumes:
      - 'redis:/data'
  web:
    image: ruby:3.3-slim⁠
    ports:
      - "3000:3000"
    volumes:
      - '.:/app'
    depends_on:
      - postgres
      - redis
    ulimits:
      nofile:
        soft: 8192
        hard: 8192


volumes:
  postgres:
  redis:
  web: